[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betalens-db-manager"
version = "0.3.0"
description = "Standalone multi-source database lifecycle and audited ingestion manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3", "psycopg2-binary>=2.9,<3", "tushare>=1.4,<2",
  "python-dotenv>=1,<2", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "tzdata>=2024.1",
]

[project.optional-dependencies]
files = ["openpyxl>=3.1,<4", "pyarrow>=14"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
betalens-db-manager = "betalens_db_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
betalens_db_manager = ["catalog.json", "templates/*", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

