meta:
  class: tdx
  name: RSI_SLOW
  source: 通达信(TDX)指标公式：RSI 快慢线
  formula: RSI_SLOW = SMA(MAX(CLOSE-REF(CLOSE,1),0),12,1) / SMA(|CLOSE-REF(CLOSE,1)|,12,1) * 100
  logic: 12 日慢速 RSI；高值=中期上涨动量强 → 高分组做多（positive）。
factor_spec:
  inputs:
    close_wide: close
  compute_kwargs:
    window: 12
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 20
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  output_dir: ../../../outputs/runs/tdx/RSI_SLOW
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
