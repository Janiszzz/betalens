meta:
  class: alpha101
  name: ALPHA51
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: '((delay(close,20)-delay(close,10))/10-(delay(close,10)-close)/10)<-0.05
    ? 1 : -1*(close-delay(close,1))'
  logic: 严格按论文公式计算，高值作为正向截面因子。
