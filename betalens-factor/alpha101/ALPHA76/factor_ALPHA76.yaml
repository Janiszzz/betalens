meta:
  class: alpha101
  name: ALPHA76
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*max(rank(decay_linear(delta(vwap,1.24383),11.8259)),ts_rank(decay_linear(ts_rank(correlation(indneutralize(low,sector),adv81,8.14941),19.569),17.1543),19.383))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    low_wide: low
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs:
    sector_wide: {scheme_code: null, level: 1}
  compute_kwargs:
    vwap_delta_lag: 1.24383
    delta_vwap_decay_window: 11.8259
    amount_average_window: 81
    indneutralize_low_sector_adv_correlation_window: 8.14941
    corr_rank_window: 19.569
    ts_rank_corr_decay_window: 17.1543
    decay_linear_ts_rank_corr_rank_window: 19.383
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 141
  mask_inputs_by_pit: true
weight:
