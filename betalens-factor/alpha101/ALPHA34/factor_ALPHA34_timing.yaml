meta:
  class: alpha101
  name: ALPHA34_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA34 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    returns_wide: 涨跌幅(%)
  industry_inputs: {}
  compute_kwargs:
    rank_stddev_returns_complement_base: 1
    returns_stddev_window: 2
    returns_stddev_window_2: 5
    rank_delta_close_complement_base: 1
    close_delta_lag: 1
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 5
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    rank_stddev_returns_complement_base:
    - 1
    returns_stddev_window:
    - 1
    - 2
    - 4
    returns_stddev_window_2:
    - 3
    - 5
    - 10
    rank_delta_close_complement_base:
    - 1
    close_delta_lag:
    - 1
    - 2
