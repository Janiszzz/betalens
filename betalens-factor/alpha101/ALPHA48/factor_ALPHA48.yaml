meta:
  class: alpha101
  name: ALPHA48
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: indneutralize(correlation(delta(close,1),delta(delay(close,1),1),250)*delta(close,1)/close,subindustry)/sum((delta(close,1)/delay(close,1))^2,250)
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
  industry_inputs:
    subindustry_wide: 申万三级行业
  compute_kwargs: {}
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 252
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
