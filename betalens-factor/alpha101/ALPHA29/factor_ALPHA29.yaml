meta:
  class: alpha101
  name: ALPHA29
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: min(product(rank(rank(scale(log(sum(ts_min(rank(rank(-1*rank(delta(close-1,5)))),2),1))))),1),5)+ts_rank(delay(-returns,6),5)
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    returns_wide: 涨跌幅(%)
  industry_inputs: {}
  compute_kwargs:
    close_center: 1
    close_delta_lag: 5
    rank_inner_minimum_window: 2
    ts_min_rank_inner_sum_window: 1
    rank_scale_ts_sum_product_window: 1
    product_rank_scale_minimum_window: 5
    returns_delay_lag: 6
    delay_returns_rank_window: 5
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 11
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    close_center:
    - 1
    close_delta_lag:
    - 3
    - 5
    - 10
    rank_inner_minimum_window:
    - 1
