meta:
  class: alpha101
  name: ALPHA29
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: min(product(rank(rank(scale(log(sum(ts_min(rank(rank(-1*rank(delta(close-1,5)))),2),1))))),1),5)+ts_rank(delay(-returns,6),5)
  logic: 严格按论文公式计算，高值作为正向截面因子。
