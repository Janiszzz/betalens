meta:
  class: alpha101
  name: ALPHA88
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: min(rank(decay_linear(rank(open)+rank(low)-rank(high)-rank(close),8.06882)),ts_rank(decay_linear(correlation(ts_rank(close,8.44728),ts_rank(adv60,20.6966),8.01266),6.65053),2.61957))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    close_wide: 收盘价(元)
    high_wide: 最高价(元)
    low_wide: 最低价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    rank_close_high_decay_window: 8.06882
    close_rank_window: 8.44728
    amount_average_window: 60
    adv_rank_window: 20.6966
    ts_rank_close_ts_rank_adv_correlation_window: 8.01266
    corr_decay_window: 6.65053
    decay_linear_corr_rank_window: 2.61957
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 95
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    rank_close_high_decay_window:
    - 4.03441
    - 8.06882
    - 16.13764
    close_rank_window:
    - 4.22364
    - 8.44728
    - 16.89456
    amount_average_window:
    - 30
    - 60
    - 120
    adv_rank_window:
    - 20.6966
    ts_rank_close_ts_rank_adv_correlation_window:
    - 8.01266
