meta:
  class: alpha101
  name: ALPHA96
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*max(ts_rank(decay_linear(correlation(rank(vwap),rank(volume),3.83878),4.16783),8.38151),ts_rank(decay_linear(ts_argmax(correlation(ts_rank(close,7.45404),ts_rank(adv60,4.13242),3.65459),12.6556),14.0365),13.4143))
  logic: 严格按论文公式计算，高值作为正向截面因子。
