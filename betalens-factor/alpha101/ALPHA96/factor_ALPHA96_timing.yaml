meta:
  class: alpha101
  name: ALPHA96_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA96 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    close_wide: close
    volume_wide: volume
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs: {}
  compute_kwargs:
    rank_vwap_rank_volume_correlation_window: 3.83878
    correlation_rank_vwap_decay_window: 4.16783
    decay_linear_correlation_rank_rank_window: 8.38151
    close_rank_window: 7.45404
    amount_average_window: 60
    adv_rank_window: 4.13242
    ts_rank_close_ts_rank_adv_correlation_window: 3.65459
    corr_argmax_window: 12.6556
    ts_argmax_corr_decay_window: 14.0365
    decay_linear_ts_argmax_corr_rank_window: 13.4143
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 103
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
