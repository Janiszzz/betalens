meta:
  class: alpha101
  name: ALPHA82_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA82 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    volume_wide: 成交量(股)
  industry_inputs:
    sector_wide: 申万一级行业
  compute_kwargs:
    open_delta_lag: 1.46063
    delta_open_decay_window: 14.8717
    indneutralize_volume_sector_open_correlation_window: 17.4842
    corr_decay_window: 6.92131
    decay_linear_corr_rank_window: 13.4283
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 35
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    open_delta_lag:
    - 1.0
    - 1.46063
    - 2.92126
    delta_open_decay_window:
    - 7.43585
    - 14.8717
    - 29.7434
    indneutralize_volume_sector_open_correlation_window:
    - 8.7421
    - 17.4842
    - 34.9684
    corr_decay_window:
    - 6.92131
    decay_linear_corr_rank_window:
    - 13.4283
