meta:
  class: alpha101
  name: ALPHA82
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*min(rank(decay_linear(delta(open,1.46063),14.8717)),ts_rank(decay_linear(correlation(indneutralize(volume,sector),open,17.4842),6.92131),13.4283))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    volume_wide: 成交量(股)
  industry_inputs:
    sector_wide: 申万一级行业
  compute_kwargs:
    formula_params:
      window_1: 17.4842
      window_2: 13.4283
      window_3: 14.8717
      window_4: 6.92131
      lag_1: 1.46063
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 35
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
