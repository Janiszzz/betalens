meta:
  class: alpha101
  name: ALPHA71_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA71 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    open_wide: open
    close_wide: close
    low_wide: low
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs: {}
  compute_kwargs:
    close_rank_window: 3.43976
    amount_average_window: 180
    adv_rank_window: 12.0647
    ts_rank_close_ts_rank_adv_correlation_window: 18.0175
    correlation_ts_rank_close_decay_window: 4.20501
    decay_linear_correlation_ts_rank_rank_window: 15.6948
    rank_vwap_low_power_exponent: 2
    rank_vwap_low_decay_window: 16.4662
    decay_linear_rank_vwap_rank_window: 4.4388
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 226
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: ../../../outputs/runs/alpha101/ALPHA71_timing
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
