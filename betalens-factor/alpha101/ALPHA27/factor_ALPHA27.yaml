meta:
  class: alpha101
  name: ALPHA27
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: '0.5<rank(sum(correlation(rank(volume),rank(vwap),6),2)/2) ? -1 : 1'
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    volume_wide: 成交量(股)
    vwap_wide: 均价(元)
  industry_inputs: {}
  compute_kwargs:
    rank_volume_rank_vwap_correlation_window: 6
    correlation_rank_volume_sum_window: 2
    ts_sum_correlation_rank_divisor: 2.0
    value_threshold: 0.5
    value_true_value: -1.0
    value_false_value: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 7
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    rank_volume_rank_vwap_correlation_window:
    - 3
    - 6
    - 12
    correlation_rank_volume_sum_window:
    - 1
    - 2
    - 4
    ts_sum_correlation_rank_divisor:
    - 2.0
    value_threshold:
    - 0.25
    - 0.5
    - 0.75
    value_true_value:
    - -1.0
    value_false_value:
    - 1.0
