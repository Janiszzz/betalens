  inputs:
    open_wide: open
    close_wide: close
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs:
    sector_wide: {scheme_code: null, level: 1}
  compute_kwargs:
    close_mix_weight: 0.60733
    mixed_complement_base: 1
    mixed_complement_weight: 0.60733
    indneutralize_mixed_sector_delta_lag: 1.23438
    vwap_rank_window: 3.60973
    amount_average_window: 150
    adv_rank_window: 9.18637
    ts_rank_vwap_ts_rank_adv_correlation_window: 14.6644
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 172
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
