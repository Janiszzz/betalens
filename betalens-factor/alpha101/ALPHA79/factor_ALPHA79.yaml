meta:
  class: alpha101
  name: ALPHA79
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: rank(delta(indneutralize(close*0.60733+open*(1-0.60733),sector),1.23438))<rank(correlation(ts_rank(vwap,3.60973),ts_rank(adv150,9.18637),14.6644))
  logic: 严格按论文公式计算，高值作为正向截面因子。
