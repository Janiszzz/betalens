meta:
  class: alpha101
  name: ALPHA79_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA79 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    close_wide: 收盘价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs:
    sector_wide: 申万一级行业
  compute_kwargs:
    close_mix_weight: 0.60733
    mixed_complement_base: 1
    mixed_complement_weight: 0.60733
    indneutralize_mixed_sector_delta_lag: 1.23438
    vwap_rank_window: 3.60973
    amount_average_window: 150
    adv_rank_window: 9.18637
    ts_rank_vwap_ts_rank_adv_correlation_window: 14.6644
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
