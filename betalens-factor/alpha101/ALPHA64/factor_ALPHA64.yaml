meta:
  class: alpha101
  name: ALPHA64
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(correlation(sum(open*0.178404+low*(1-0.178404),12.7054),sum(adv120,12.7054),16.6208))<rank(delta(((high+low)/2)*0.178404+vwap*(1-0.178404),3.69741)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    high_wide: 最高价(元)
    low_wide: 最低价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    formula_params:
      coefficient_1: 0.178404
      window_1: 16.6208
      coefficient_2: 0.178404
      coefficient_3: 0.178404
      window_2: 12.7054
      window_3: 12.7054
      coefficient_4: 2
      coefficient_5: 0.178404
      window_4: 120
      lag_1: 3.69741
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 148
  mask_inputs_by_pit: true
