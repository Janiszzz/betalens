meta:
  class: alpha101
  name: ALPHA63_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA63 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    open_wide: open
    close_wide: close
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs:
    industry_wide: {scheme_code: null, level: 2}
  compute_kwargs:
    indneutralize_close_industry_delta_lag: 2.25164
    delta_indneutralize_close_decay_window: 8.22237
    vwap_mix_weight: 0.318108
    mixed_complement_base: 1
    mixed_complement_weight: 0.318108
    amount_average_window: 180
    adv_sum_window: 37.2467
    mixed_ts_sum_adv_correlation_window: 13.557
    correlation_mixed_ts_sum_decay_window: 12.2883
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 240
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
