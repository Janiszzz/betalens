meta:
  class: alpha101
  name: ALPHA63
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(decay_linear(delta(indneutralize(close,industry),2.25164),8.22237))-rank(decay_linear(correlation(vwap*0.318108+open*(1-0.318108),sum(adv180,37.2467),13.557),12.2883)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    close_wide: 收盘价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs:
    industry_wide: 申万二级行业
  compute_kwargs:
    formula_params:
      window_1: 8.22237
      coefficient_1: 0.318108
      window_2: 12.2883
      lag_1: 2.25164
      coefficient_2: 0.318108
      window_3: 13.557
      window_4: 37.2467
      window_5: 180
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 240
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
