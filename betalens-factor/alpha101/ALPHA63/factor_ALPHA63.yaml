meta:
  class: alpha101
  name: ALPHA63
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(decay_linear(delta(indneutralize(close,industry),2.25164),8.22237))-rank(decay_linear(correlation(vwap*0.318108+open*(1-0.318108),sum(adv180,37.2467),13.557),12.2883)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    close_wide: 收盘价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs:
    industry_wide: 申万二级行业
  compute_kwargs:
    indneutralize_close_industry_delta_lag: 2.25164
    delta_indneutralize_close_decay_window: 8.22237
    vwap_mix_weight: 0.318108
    mixed_complement_base: 1
    mixed_complement_weight: 0.318108
    amount_average_window: 180
    adv_sum_window: 37.2467
    mixed_ts_sum_adv_correlation_window: 13.557
    correlation_mixed_ts_sum_decay_window: 12.2883
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 240
  mask_inputs_by_pit: true
weight:
