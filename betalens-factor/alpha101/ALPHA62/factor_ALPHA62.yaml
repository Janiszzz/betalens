meta:
  class: alpha101
  name: ALPHA62
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(correlation(vwap,sum(adv20,22.4101),9.91009))<rank((rank(open)+rank(open))<(rank((high+low)/2)+rank(high))))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    high_wide: 最高价(元)
    low_wide: 最低价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    amount_average_window: 20
    adv_sum_window: 22.4101
    vwap_ts_sum_adv_correlation_window: 9.91009
    high_low_divisor: 2
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 50
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    amount_average_window:
    - 10
    - 20
    - 40
    adv_sum_window:
    - 11.20505
    - 22.4101
    - 44.8202
    vwap_ts_sum_adv_correlation_window:
    - 4.955045
    - 9.91009
    - 19.82018
    high_low_divisor:
    - 2
