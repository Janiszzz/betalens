  compute_kwargs:
    amount_average_window: 20
    adv_sum_window: 14.7444
    close_ts_sum_adv_correlation_window: 6.00049
    correlation_close_ts_sum_rank_window: 20.4195
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 58
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
