meta:
  class: alpha101
  name: ALPHA86
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(ts_rank(correlation(close,sum(adv20,14.7444),6.00049),20.4195)<rank(close-vwap))
  logic: 严格按论文公式计算，高值作为正向截面因子。
