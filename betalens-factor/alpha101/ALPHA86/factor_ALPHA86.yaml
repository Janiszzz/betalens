meta:
  class: alpha101
  name: ALPHA86
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(ts_rank(correlation(close,sum(adv20,14.7444),6.00049),20.4195)<rank(close-vwap))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: close
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs: {}
  compute_kwargs:
    amount_average_window: 20
    adv_sum_window: 14.7444
    close_ts_sum_adv_correlation_window: 6.00049
    correlation_close_ts_sum_rank_window: 20.4195
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 58
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: ../../../outputs/runs/alpha101/ALPHA86
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
