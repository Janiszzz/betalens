meta:
  class: alpha101
  name: ALPHA72_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA72 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    high_wide: high
    low_wide: low
    volume_wide: volume
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs: {}
  compute_kwargs:
    high_low_divisor: 2
    amount_average_window: 40
    high_low_adv_correlation_window: 8.93345
    correlation_adv_high_decay_window: 10.1519
    vwap_rank_window: 3.72469
    volume_rank_window: 18.5188
    ts_rank_vwap_ts_rank_volume_correlation_window: 6.86671
    correlation_ts_rank_vwap_decay_window: 2.95011
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 57
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: ../../../outputs/runs/alpha101/ALPHA72_timing
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
