meta:
  class: alpha101
  name: ALPHA91_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA91 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs:
    industry_wide: 申万二级行业
  compute_kwargs:
    indneutralize_close_industry_volume_correlation_window: 9.74928
    corr1_decay_window: 16.398
    decay_linear_corr1_decay_window: 3.83219
    decay_linear_corr1_rank_window: 4.8667
    amount_average_window: 30
    vwap_adv_correlation_window: 4.01303
    correlation_vwap_adv_decay_window: 2.6809
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 35
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    indneutralize_close_industry_volume_correlation_window:
    - 4.87464
    - 9.74928
    - 19.49856
    corr1_decay_window:
    - 8.199
    - 16.398
    - 32.796
    decay_linear_corr1_decay_window:
    - 1.916095
    - 3.83219
    - 7.66438
    decay_linear_corr1_rank_window:
    - 4.8667
    amount_average_window:
    - 30
    vwap_adv_correlation_window:
    - 4.01303
    correlation_vwap_adv_decay_window:
    - 2.6809
