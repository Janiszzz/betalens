meta:
  class: alpha101
  name: ALPHA91
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(ts_rank(decay_linear(decay_linear(correlation(indneutralize(close,industry),volume,9.74928),16.398),3.83219),4.8667)-rank(decay_linear(correlation(vwap,adv30,4.01303),2.6809)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: close
    volume_wide: volume
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs:
    industry_wide: {scheme_code: null, level: 2}
  compute_kwargs:
    indneutralize_close_industry_volume_correlation_window: 9.74928
    corr1_decay_window: 16.398
    decay_linear_corr1_decay_window: 3.83219
    decay_linear_corr1_rank_window: 4.8667
    amount_average_window: 30
    vwap_adv_correlation_window: 4.01303
    correlation_vwap_adv_decay_window: 2.6809
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 35
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
