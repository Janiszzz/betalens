meta:
  class: alpha101
  name: ALPHA93
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ts_rank(decay_linear(correlation(indneutralize(vwap,industry),adv81,17.4193),19.848),7.54455)/rank(decay_linear(delta(close*0.524434+vwap*(1-0.524434),2.77377),16.2664))
