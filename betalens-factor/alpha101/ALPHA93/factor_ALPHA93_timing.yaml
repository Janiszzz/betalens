meta:
  class: alpha101
  name: ALPHA93_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA93 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs:
    industry_wide: 申万二级行业
  compute_kwargs:
    amount_average_window: 81
    indneutralize_vwap_industry_adv_correlation_window: 17.4193
    correlation_indneutralize_vwap_decay_window: 19.848
    decay_linear_correlation_indneutralize_rank_window: 7.54455
    close_mix_weight: 0.524434
    mixed_complement_base: 1
    mixed_complement_weight: 0.524434
    mixed_delta_lag: 2.77377
    delta_mixed_decay_window: 16.2664
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 123
