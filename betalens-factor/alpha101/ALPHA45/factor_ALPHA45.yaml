meta:
  class: alpha101
  name: ALPHA45
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*rank(sum(delay(close,5),20)/20)*correlation(close,volume,2)*rank(correlation(sum(close,5),sum(close,20),2))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
  industry_inputs: {}
  compute_kwargs:
    close_delay_lag: 5
    delay_close_sum_window: 20
    ts_sum_delay_close_divisor: 20
    close_volume_correlation_window: 2
    close_sum_window: 5
    close_sum_window_2: 20
    ts_sum_close_ts_sum_close_correlation_window: 2
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 25
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    close_delay_lag:
    - 3
    - 5
    - 10
    delay_close_sum_window:
    - 10
    - 20
    - 40
    ts_sum_delay_close_divisor:
    - 20
    close_volume_correlation_window:
    - 1
    - 2
    - 4
    close_sum_window:
    - 5
    close_sum_window_2:
    - 20
    ts_sum_close_ts_sum_close_correlation_window:
    - 2
