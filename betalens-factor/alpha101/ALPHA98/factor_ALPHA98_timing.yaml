meta:
  class: alpha101
  name: ALPHA98_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA98 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    amount_average_window: 5
    adv_sum_window: 26.4719
    vwap_ts_sum_adv_correlation_window: 4.58418
    correlation_vwap_ts_sum_decay_window: 7.18088
    amount_average_window_2: 15
    rank_open_rank_adv_correlation_window: 20.8187
    corr_argmin_window: 8.62571
    ts_argmin_corr_rank_window: 6.95668
    ts_rank_ts_argmin_corr_decay_window: 8.07206
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 56
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
