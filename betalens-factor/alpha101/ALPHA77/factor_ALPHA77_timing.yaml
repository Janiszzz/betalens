meta:
  class: alpha101
  name: ALPHA77_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA77 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    high_wide: 最高价(元)
    low_wide: 最低价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    high_low_divisor: 2
    vwap_high_low_decay_window: 20.0451
    high_low_divisor_2: 2
    amount_average_window: 40
    high_low_adv_correlation_window: 3.1614
    correlation_adv_high_decay_window: 5.64125
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 47
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    high_low_divisor:
    - 2
    vwap_high_low_decay_window:
    - 10.02255
    - 20.0451
    - 40.0902
    high_low_divisor_2:
    - 2
    amount_average_window:
    - 20
    - 40
    - 80
    high_low_adv_correlation_window:
    - 1.5807
    - 3.1614
    - 6.3228
    correlation_adv_high_decay_window:
    - 5.64125
