meta:
  class: alpha101
  name: ALPHA77
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: min(rank(decay_linear((high+low)/2-vwap,20.0451)),rank(decay_linear(correlation((high+low)/2,adv40,3.1614),5.64125)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    high_wide: high
    low_wide: low
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs: {}
  compute_kwargs:
    high_low_divisor: 2
    vwap_high_low_decay_window: 20.0451
    high_low_divisor_2: 2
    amount_average_window: 40
    high_low_adv_correlation_window: 3.1614
    correlation_adv_high_decay_window: 5.64125
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 47
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: ../../../outputs/runs/alpha101/ALPHA77
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
