meta:
  class: alpha101
  name: ALPHA100
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*((1.5*scale(indneutralize(indneutralize(rank((((close-low)-(high-close))/(high-low))*volume),subindustry),subindustry))-scale(indneutralize(correlation(close,rank(adv20),5)-rank(ts_argmin(close,30)),subindustry)))*(volume/adv20))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    high_wide: 最高价(元)
    low_wide: 最低价(元)
    volume_wide: 成交量(股)
    amount_wide: 成交金额(元)
  industry_inputs:
    subindustry_wide: 申万三级行业
  compute_kwargs:
    amount_average_window: 20
    close_rank_adv_correlation_window: 5
    close_argmin_window: 30
    scale_first_coefficient: 1.5
    amount_average_window_2: 20
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 30
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    amount_average_window:
    - 10
    - 20
    - 40
    close_rank_adv_correlation_window:
    - 3
    - 5
    - 10
    close_argmin_window:
    - 15
    - 30
    - 60
    scale_first_coefficient:
    - 1.5
    amount_average_window_2:
    - 20
