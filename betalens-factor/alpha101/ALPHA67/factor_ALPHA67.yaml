meta:
  class: alpha101
  name: ALPHA67
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(high-ts_min(high,2.14593))^rank(correlation(indneutralize(vwap,sector),indneutralize(adv20,subindustry),6.02936)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    high_wide: high
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs:
    sector_wide: {scheme_code: null, level: 1}
    subindustry_wide: {scheme_code: null, level: 3}
  compute_kwargs:
    high_minimum_window: 2.14593
    amount_average_window: 20
    indneutralize_vwap_sector_indneutralize_subindustry_adv_correlation_wind: 6.02936
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 25
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: ../../../outputs/runs/alpha101/ALPHA67
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
