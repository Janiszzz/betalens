meta:
  class: alpha101
  name: ALPHA67
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(high-ts_min(high,2.14593))^rank(correlation(indneutralize(vwap,sector),indneutralize(adv20,subindustry),6.02936)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
