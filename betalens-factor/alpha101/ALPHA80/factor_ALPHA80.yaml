meta:
  class: alpha101
  name: ALPHA80
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(sign(delta(indneutralize(open*0.868128+high*(1-0.868128),industry),4.04545)))^ts_rank(correlation(high,adv10,5.11456),5.53756))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: open
    high_wide: high
    amount_wide: amount
  industry_inputs:
    industry_wide: {scheme_code: null, level: 2}
  compute_kwargs:
    open_mix_weight: 0.868128
    mixed_complement_base: 1
    mixed_complement_weight: 0.868128
    indneutralize_mixed_industry_delta_lag: 4.04545
    amount_average_window: 10
    high_adv_correlation_window: 5.11456
    correlation_high_adv_rank_window: 5.53756
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 19
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
