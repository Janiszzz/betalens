meta:
  class: alpha101
  name: ALPHA90
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(close-ts_max(close,4.66719))^ts_rank(correlation(indneutralize(adv40,subindustry),low,5.38375),3.21856))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    low_wide: 最低价(元)
    amount_wide: 成交金额(元)
  industry_inputs:
    subindustry_wide: 申万三级行业
  compute_kwargs:
    close_maximum_window: 4.66719
    amount_average_window: 40
    indneutralize_subindustry_adv_low_correlation_window: 5.38375
    correlation_low_indneutralize_rank_window: 3.21856
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 46
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    close_maximum_window:
    - 2.333595
    - 4.66719
    - 9.33438
    amount_average_window:
    - 20
    - 40
    - 80
    indneutralize_subindustry_adv_low_correlation_window:
    - 2.691875
    - 5.38375
    - 10.7675
    correlation_low_indneutralize_rank_window:
    - 3.21856
