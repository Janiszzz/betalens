meta:
  class: alpha101
  name: ALPHA70
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(delta(vwap,1.29456))^ts_rank(correlation(indneutralize(close,industry),adv50,17.8256),17.9171))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs:
    industry_wide: 申万二级行业
  compute_kwargs:
    vwap_delta_lag: 1.29456
    amount_average_window: 50
    indneutralize_close_industry_adv_correlation_window: 17.8256
    correlation_indneutralize_close_rank_window: 17.9171
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 84
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    vwap_delta_lag:
    - 1.0
    - 1.29456
    - 2.58912
    amount_average_window:
    - 25
    - 50
    - 100
    indneutralize_close_industry_adv_correlation_window:
    - 8.9128
    - 17.8256
    - 35.6512
    correlation_indneutralize_close_rank_window:
    - 17.9171
