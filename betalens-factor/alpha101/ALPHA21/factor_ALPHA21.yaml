meta:
  class: alpha101
  name: ALPHA21
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: 'sum(close,8)/8+stddev(close,8)<sum(close,2)/2 ? -1 : (sum(close,2)/2<sum(close,8)/8-stddev(close,8)
    ? 1 : (1<=volume/adv20 ? 1 : -1))'
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    formula_params:
      window_1: 8
      window_2: 2
      window_3: 8
      window_4: 8
      window_5: 20
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 20
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
