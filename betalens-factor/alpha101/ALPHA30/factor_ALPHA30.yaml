meta:
  class: alpha101
  name: ALPHA30
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: (1-rank(sign(close-delay(close,1))+sign(delay(close,1)-delay(close,2))+sign(delay(close,2)-delay(close,3))))*sum(volume,5)/sum(volume,20)
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
  industry_inputs: {}
  compute_kwargs:
    close_delay_lag: 1
    close_delay_lag_2: 1
    close_delay_lag_3: 2
    close_delay_lag_4: 2
    close_delay_lag_5: 3
    rank_direction_complement_base: 1
    volume_sum_window: 5
    volume_sum_window_2: 20
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 20
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    close_delay_lag:
    - 1
    - 2
    close_delay_lag_2:
    - 1
    - 2
    close_delay_lag_3:
    - 1
    - 2
    - 4
    close_delay_lag_4:
    - 2
    close_delay_lag_5:
    - 3
    rank_direction_complement_base:
    - 1
    volume_sum_window:
    - 5
    volume_sum_window_2:
    - 20
