meta:
  class: alpha101
  name: ALPHA31
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: rank(rank(rank(decay_linear(-1*rank(rank(delta(close,10))),10))))+rank(-1*delta(close,3))+sign(scale(correlation(adv20,low,12)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    low_wide: 最低价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    close_delta_lag: 10
    rank_delta_close_decay_window: 10
    close_delta_lag_2: 3
    amount_average_window: 20
    adv_low_correlation_window: 12
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 31
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    close_delta_lag:
    - 5
    - 10
    - 20
    rank_delta_close_decay_window:
    - 5
    - 10
    - 20
    close_delta_lag_2:
    - 2
    - 3
    - 6
    amount_average_window:
    - 20
    adv_low_correlation_window:
    - 12
