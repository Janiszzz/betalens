meta:
  class: alpha101
  name: ALPHA36
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: 2.21*rank(correlation(close-open,delay(volume,1),15))+0.7*rank(open-close)+0.73*rank(ts_rank(delay(-returns,6),5))+rank(abs(correlation(vwap,adv20,6)))+0.6*rank((sum(close,200)/200-open)*(close-open))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
    vwap_wide: 均价(元)
    returns_wide: 涨跌幅(%)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    rank_correlation_close_coefficient: 2.21
    volume_delay_lag: 1
    close_open_delay_volume_correlation_window: 15
    rank_open_close_coefficient: 0.7
    rank_ts_rank_delay_coefficient: 0.73
    returns_delay_lag: 6
    delay_returns_rank_window: 5
    amount_average_window: 20
    vwap_adv_correlation_window: 6
    rank_open_close_coefficient_2: 0.6
    close_mean_window: 200
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 200
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    rank_correlation_close_coefficient:
    - 2.21
    volume_delay_lag:
    - 1
    - 2
    close_open_delay_volume_correlation_window:
    - 8
    - 15
    - 30
    rank_open_close_coefficient:
    - 0.7
    rank_ts_rank_delay_coefficient:
    - 0.73
    returns_delay_lag:
    - 3
    - 6
    - 12
    delay_returns_rank_window:
    - 5
    amount_average_window:
    - 20
    vwap_adv_correlation_window:
    - 6
    rank_open_close_coefficient_2:
    - 0.6
    close_mean_window:
    - 200
