meta:
  class: alpha101
  name: ALPHA36
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: 2.21*rank(correlation(close-open,delay(volume,1),15))+0.7*rank(open-close)+0.73*rank(ts_rank(delay(-returns,6),5))+rank(abs(correlation(vwap,adv20,6)))+0.6*rank((sum(close,200)/200-open)*(close-open))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
    vwap_wide: 均价(元)
    returns_wide: 涨跌幅(%)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    formula_params:
      coefficient_1: 0.6
      coefficient_2: 0.73
      coefficient_3: 2.21
      coefficient_4: 0.7
      window_1: 5
      window_2: 6
      window_3: 200
      window_4: 15
      lag_1: 6
      window_5: 20
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 200
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
