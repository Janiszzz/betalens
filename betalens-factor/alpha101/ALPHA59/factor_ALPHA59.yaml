meta:
  class: alpha101
  name: ALPHA59
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*ts_rank(decay_linear(correlation(indneutralize(vwap*0.728317+vwap*(1-0.728317),industry),volume,4.25197),16.2289),8.19648)
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    volume_wide: volume
    vwap_wide: average_price
  industry_inputs:
    industry_wide: {scheme_code: null, level: 2}
  compute_kwargs:
    vwap_mix_weight: 0.728317
    mixed_complement_base: 1
    mixed_complement_weight: 0.728317
    indneutralize_mixed_industry_volume_correlation_window: 4.25197
    value_decay_window: 16.2289
    decay_linear_value_rank_window: 8.19648
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 26
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
