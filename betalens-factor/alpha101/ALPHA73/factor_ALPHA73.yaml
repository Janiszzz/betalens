meta:
  class: alpha101
  name: ALPHA73
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*max(rank(decay_linear(delta(vwap,4.72775),2.91864)),ts_rank(decay_linear(-1*delta(open*0.147155+low*(1-0.147155),2.03608)/(open*0.147155+low*(1-0.147155)),3.33829),16.7411))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: open
    low_wide: low
    vwap_wide: average_price
  industry_inputs: {}
  compute_kwargs:
    vwap_delta_lag: 4.72775
    delta_vwap_decay_window: 2.91864
    open_mix_weight: 0.147155
    mixed_complement_base: 1
    mixed_complement_weight: 0.147155
    mixed_delta_lag: 2.03608
    mixed_delta_decay_window: 3.33829
    decay_linear_mixed_delta_rank_window: 16.7411
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 21
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: ../../../outputs/runs/alpha101/ALPHA73
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
