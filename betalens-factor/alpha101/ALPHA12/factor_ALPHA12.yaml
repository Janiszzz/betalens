meta:
  class: alpha101
  name: ALPHA12
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: sign(delta(volume,1))*(-1*delta(close,1))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
  industry_inputs: {}
  compute_kwargs:
    volume_delta_lag: 46
    close_delta_lag: 11
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  winsorize_method: none
  winsorize_n: 3.0
  standardize_method: zscore
  neutralize: true
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 2
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: "max"
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2015-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  grouping_mode: equal_count
  n_quantiles: 40
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
