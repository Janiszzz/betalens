meta:
  class: alpha101
  name: ALPHA89
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ts_rank(decay_linear(correlation(low,adv10,6.94279),5.51607),3.79744)-ts_rank(decay_linear(delta(indneutralize(vwap,industry),3.48158),10.1466),15.3012)
  logic: 严格按论文公式计算，高值作为正向截面因子。
