meta:
  class: alpha101
  name: ALPHA89_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA89 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    low_wide: low
    vwap_wide: average_price
    amount_wide: amount
  industry_inputs:
    industry_wide: {scheme_code: null, level: 2}
  compute_kwargs:
    amount_average_window: 10
    low_adv_correlation_window: 6.94279
    correlation_low_adv_decay_window: 5.51607
    decay_linear_correlation_low_rank_window: 3.79744
    indneutralize_vwap_industry_delta_lag: 3.48158
    delta_indneutralize_vwap_decay_window: 10.1466
    decay_linear_delta_indneutralize_rank_window: 15.3012
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 27
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
