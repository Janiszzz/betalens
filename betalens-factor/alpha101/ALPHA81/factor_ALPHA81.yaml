meta:
  class: alpha101
  name: ALPHA81
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(log(product(rank(rank(correlation(vwap,sum(adv10,49.6054),8.47743))^4),14.9655)))<rank(correlation(rank(vwap),rank(volume),5.07914)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
