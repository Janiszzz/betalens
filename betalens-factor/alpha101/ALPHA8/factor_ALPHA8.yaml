meta:
  class: alpha101
  name: ALPHA8
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*rank(sum(open,5)*sum(returns,5)-delay(sum(open,5)*sum(returns,5),10))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    returns_wide: 涨跌幅(%)
  industry_inputs: {}
  compute_kwargs:
    open_sum_window: 5
    returns_sum_window: 5
    base_delay_lag: 10
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 15
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    open_sum_window:
    - 3
    - 5
    - 10
    returns_sum_window:
    - 3
    - 5
    - 10
    base_delay_lag:
    - 5
    - 10
    - 20
