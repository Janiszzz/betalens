meta:
  class: alpha101
  name: ALPHA55
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*correlation(rank((close-ts_min(low,12))/(ts_max(high,12)-ts_min(low,12))),rank(volume),6)
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: close
    high_wide: high
    low_wide: low
    volume_wide: volume
  industry_inputs: {}
  compute_kwargs:
    low_minimum_window: 12
    high_maximum_window: 12
    low_minimum_window_2: 12
    rank_stochastic_rank_volume_correlation_window: 6
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 17
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: ../../../outputs/runs/alpha101/ALPHA55
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
