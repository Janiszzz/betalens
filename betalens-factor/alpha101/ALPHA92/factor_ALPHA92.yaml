meta:
  class: alpha101
  name: ALPHA92
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: min(ts_rank(decay_linear(((high+low)/2+close)<(low+open),14.7221),18.8683),ts_rank(decay_linear(correlation(rank(low),rank(adv30),7.58555),6.94024),6.80584))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: open
    close_wide: close
    high_wide: high
    low_wide: low
    amount_wide: amount
  industry_inputs: {}
  compute_kwargs:
    high_low_divisor: 2
    condition_decay_window: 14.7221
    decay_linear_condition_rank_window: 18.8683
    amount_average_window: 30
    rank_low_rank_adv_correlation_window: 7.58555
    correlation_rank_low_decay_window: 6.94024
    decay_linear_correlation_rank_rank_window: 6.80584
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 49
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
