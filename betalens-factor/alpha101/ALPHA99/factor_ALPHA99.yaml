meta:
  class: alpha101
  name: ALPHA99
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(correlation(sum((high+low)/2,19.8975),sum(adv60,19.8975),8.8136))<rank(correlation(low,volume,6.28259)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
