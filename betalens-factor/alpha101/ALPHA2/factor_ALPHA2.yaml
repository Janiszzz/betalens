meta:
  class: alpha101
  name: ALPHA2
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*correlation(rank(delta(log(volume),2)),rank((close-open)/open),6)
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
  industry_inputs: {}
  compute_kwargs:
    volume_delta_lag: 1
    rank_delta_volume_rank_open_close_correlation_window: 3
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 8
  mask_inputs_by_pit: true
weight:
