meta:
  class: alpha101
  name: ALPHA78_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA78 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    low_wide: 最低价(元)
    volume_wide: 成交量(股)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    low_mix_weight: 0.352233
    mixed_complement_base: 1
    mixed_complement_weight: 0.352233
    mixed_sum_window: 19.7428
    amount_average_window: 40
    adv_sum_window: 19.7428
    ts_sum_mixed_ts_sum_adv_correlation_window: 6.83313
    rank_vwap_rank_volume_correlation_window: 5.77492
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
