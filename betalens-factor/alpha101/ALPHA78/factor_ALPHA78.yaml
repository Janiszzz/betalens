meta:
  class: alpha101
  name: ALPHA78
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: rank(correlation(sum(low*0.352233+vwap*(1-0.352233),19.7428),sum(adv40,19.7428),6.83313))^rank(correlation(rank(vwap),rank(volume),5.77492))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    low_wide: 最低价(元)
    volume_wide: 成交量(股)
    vwap_wide: 均价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    formula_params:
      coefficient_1: 0.352233
      window_1: 6.83313
      window_2: 5.77492
      coefficient_2: 0.352233
      window_3: 19.7428
      window_4: 19.7428
      window_5: 40
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 65
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
