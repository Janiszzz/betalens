meta:
  class: alpha101
  name: ALPHA22
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*delta(correlation(high,volume,5),5)*rank(stddev(close,20))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    high_wide: 最高价(元)
    volume_wide: 成交量(股)
  industry_inputs: {}
  compute_kwargs:
    high_volume_correlation_window: 5
    correlation_high_volume_delta_lag: 5
    close_stddev_window: 20
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 20
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    high_volume_correlation_window:
    - 3
    - 5
    - 10
    correlation_high_volume_delta_lag:
    - 3
    - 5
    - 10
    close_stddev_window:
    - 10
    - 20
    - 40
