meta:
  class: alpha101
  name: ALPHA22
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*delta(correlation(high,volume,5),5)*rank(stddev(close,20))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: close
    high_wide: high
    volume_wide: volume
  industry_inputs: {}
  compute_kwargs:
    high_volume_correlation_window: 5
    correlation_high_volume_delta_lag: 5
    close_stddev_window: 20
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 20
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
