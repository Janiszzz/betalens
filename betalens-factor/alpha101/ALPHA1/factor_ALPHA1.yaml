meta:
  class: alpha101
  name: ALPHA1
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: 'rank(ts_argmax(signedpower((returns < 0 ? stddev(returns,20) : close),2),5))-0.5'
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: close
    returns_wide: pct_change
  industry_inputs: {}
  compute_kwargs:
    returns_threshold: -0.05
    returns_stddev_window: 40
    base_power_exponent: 1.0
    signed_power_base_argmax_window: 5
    rank_ts_argmax_signed_power_center: 0.5
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 24
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups:
  short_groups: 
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 40
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: ../../../outputs/runs/alpha101/ALPHA1
experiment_export:
  enabled: false
  store_path: outputs/experiments.lmdb
