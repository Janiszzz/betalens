meta:
  class: alpha101
  name: ALPHA39
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*rank(delta(close,7)*(1-rank(decay_linear(volume/adv20,9))))*(1+rank(sum(returns,250)))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    volume_wide: 成交量(股)
    returns_wide: 涨跌幅(%)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    close_delta_lag: 7
    rank_decay_linear_volume_complement_base: 1
    amount_average_window: 20
    volume_adv_decay_window: 9
    rank_ts_sum_returns_offset: 1
    returns_sum_window: 250
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 250
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    close_delta_lag:
    - 4
    - 7
    - 14
    rank_decay_linear_volume_complement_base:
    - 1
    amount_average_window:
    - 10
    - 20
    - 40
    volume_adv_decay_window:
    - 5
    - 9
    - 18
    rank_ts_sum_returns_offset:
    - 1
    returns_sum_window:
    - 250
