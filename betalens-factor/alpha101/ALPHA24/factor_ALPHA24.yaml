meta:
  class: alpha101
  name: ALPHA24
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: 'delta(sum(close,100)/100,100)/delay(close,100)<=0.05 ? -1*(close-ts_min(close,100))
    : -1*delta(close,3)'
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
  industry_inputs: {}
  compute_kwargs:
    close_mean_window: 100
    ts_mean_close_delta_lag: 100
    close_delay_lag: 100
    trend_threshold: 0.05
    close_minimum_window: 100
    close_delta_lag: 3
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 200
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    close_mean_window:
    - 50
    - 100
    - 200
    ts_mean_close_delta_lag:
    - 50
    - 100
    - 200
    close_delay_lag:
    - 50
    - 100
    - 200
    trend_threshold:
    - 0.05
    close_minimum_window:
    - 100
    close_delta_lag:
    - 3
