meta:
  class: alpha101
  name: ALPHA58
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*ts_rank(decay_linear(correlation(indneutralize(vwap,sector),volume,3.92795),7.89291),5.50322)
  logic: 严格按论文公式计算，高值作为正向截面因子。
