meta:
  class: alpha101
  name: ALPHA66
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(decay_linear(delta(vwap,3.51013),7.23052))+ts_rank(decay_linear((low-vwap)/(open-(high+low)/2),11.4157),6.72611))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: open
    high_wide: high
    low_wide: low
    vwap_wide: average_price
  industry_inputs: {}
  compute_kwargs:
    vwap_delta_lag: 3.51013
    delta_vwap_decay_window: 7.23052
    high_low_divisor: 2
    right_base_decay_window: 11.4157
    decay_linear_right_base_rank_window: 6.72611
  direction: positive
  table_name: market_daily_post_adjusted
  query_filters: {asset_type: stock}
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: {scheme_code: null, level: 1}
  backtest_metric: close
  required_history_bars: 17
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
