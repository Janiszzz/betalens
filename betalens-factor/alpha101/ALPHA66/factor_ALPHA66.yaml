meta:
  class: alpha101
  name: ALPHA66
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*(rank(decay_linear(delta(vwap,3.51013),7.23052))+ts_rank(decay_linear((low-vwap)/(open-(high+low)/2),11.4157),6.72611))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    open_wide: 开盘价(元)
