meta:
  class: alpha101
  name: ALPHA46_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA46 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    close_wide: 收盘价(元)
  industry_inputs: {}
  compute_kwargs:
    trend_long_delay_lag: 20
    trend_first_short_delay_lag: 10
    trend_first_slope_divisor: 10
    trend_second_short_delay_lag: 10
    trend_second_slope_divisor: 10
    trend_threshold: 0.25
    trend_true_value: -1.0
    trend_threshold_2: 0
    trend_true_value_2: 1.0
    close_delay_lag: 1
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 21
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: false
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    trend_long_delay_lag:
    - 10
    - 20
    - 40
    trend_first_short_delay_lag:
    - 5
    - 10
    - 20
    trend_first_slope_divisor:
    - 10
    trend_second_short_delay_lag:
    - 5
    - 10
    - 20
    trend_second_slope_divisor:
    - 10
    trend_threshold:
    - 0.25
    trend_true_value:
    - -1.0
    trend_threshold_2:
    - 0
    trend_true_value_2:
    - 1.0
    close_delay_lag:
    - 1
