meta:
  class: alpha101
  name: ALPHA56
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: -1*rank(sum(returns,10)/sum(sum(returns,2),3))*rank(returns*cap)
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    returns_wide: 涨跌幅(%)
    cap_wide: 总市值(元)
  industry_inputs: {}
  compute_kwargs:
    returns_sum_window: 10
    returns_sum_window_2: 2
    ts_sum_returns_sum_window: 3
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 10
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    returns_sum_window:
    - 5
    - 10
    - 20
    returns_sum_window_2:
    - 1
    - 2
    - 4
    ts_sum_returns_sum_window:
    - 2
    - 3
    - 6
