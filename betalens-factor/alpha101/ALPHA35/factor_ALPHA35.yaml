meta:
  class: alpha101
  name: ALPHA35
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ts_rank(volume,32)*(1-ts_rank(close+high-low,16))*(1-ts_rank(returns,32))
  logic: 严格按论文公式计算，高值作为正向截面因子。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
    high_wide: 最高价(元)
    low_wide: 最低价(元)
    volume_wide: 成交量(股)
    returns_wide: 涨跌幅(%)
  industry_inputs: {}
  compute_kwargs:
    volume_rank_window: 32
    ts_rank_low_close_complement_base: 1
    low_close_high_rank_window: 16
    ts_rank_returns_complement_base: 1
    returns_rank_window: 32
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: true
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 开盘价(元)
  required_history_bars: 32
  mask_inputs_by_pit: true
weight:
  mode: classic-long-short
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: W
  n_quantiles: 10
  initial_amount: 100000000
  benchmark_code: 000906.SH
  include_profiling: true
  dump_excel: true
  warmup_days: null
  output_dir: outputs/runs/manual
mining:
  sampler: grid
  search_space:
    volume_rank_window:
    - 16
    - 32
    - 64
    ts_rank_low_close_complement_base:
    - 1
    low_close_high_rank_window:
    - 8
    - 16
    - 32
    ts_rank_returns_complement_base:
    - 1
    returns_rank_window:
    - 16
    - 32
    - 64
