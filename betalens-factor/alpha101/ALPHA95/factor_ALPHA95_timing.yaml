meta:
  class: alpha101
  name: ALPHA95_timing
  source: WorldQuant 101 Formulaic Alphas (Kakushadze 2016)
  formula: ALPHA95 rolling-z timing
  logic: 以中证800日频PIT截面作为公式上下文并始终纳入目标股票；高于过去120个有效观测的均值+1σ时满仓做空，否则持币。
  strategy_type: timing
factor_spec:
  inputs:
    open_wide: 开盘价(元)
    high_wide: 最高价(元)
    low_wide: 最低价(元)
    amount_wide: 成交金额(元)
  industry_inputs: {}
  compute_kwargs:
    open_minimum_window: 12.4105
    high_low_divisor: 2
    high_low_sum_window: 19.1351
    amount_average_window: 40
    adv_sum_window: 19.1351
    ts_sum_high_low_ts_sum_adv_correlation_window: 12.8742
    right_constant: 5
    rank_corr_rank_window: 11.7584
    stock_code: 300750.SZ
    signal_weight:
      method: rolling_z
      window: 120
      sigma: 1.0
      operator: gt
      side: short
      max_weight: 1.0
  direction: positive
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
  required_history_bars: 81
  mask_inputs_by_pit: true
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
