runtime:
  # 可选：process | serial。process 使用多进程，serial 便于调试。
  backend: process
  # 请求的工作进程数，正整数；框架可能根据内存预算自动下调。
  workers: 16
  chunk_size: 1
  # 可用于 mining 的系统内存比例，范围 (0, 1]。
  max_memory_ratio: 0.7

cache:
  # 可选：true | false。true 将任务输入写为 NPY/memmap；结果 SQLite 始终生成。
  data_enabled: true

output:
  # 任务输出根目录；相对路径以本 performance.yaml 所在目录为基准。
  # 实际目录为 <directory>/<因子ID>/<本地时间_短ID>/。
  directory: outputs/mining

logging:
  # 可选：DEBUG | INFO | WARNING | ERROR | CRITICAL。
  level: INFO
  # 可选：true | false。是否输出候选和窗口级详细日志。
  task_logs: true
  # 长任务存活提示间隔（秒）；设为 0 可关闭。
  heartbeat_seconds: 30
