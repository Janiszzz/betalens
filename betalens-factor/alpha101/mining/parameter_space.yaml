# 配置版本；当前仅支持 1。
version: 1
# 因子类别；用于任务元信息、输出归类，并启用 alpha101 的 `factors: all` 展开。
factor_class: alpha101

# Alpha12 使用显式参数空间，避免自动生成器扩大或改变指定边界。
factors:
  ALPHA12:
    module: alpha101_mining
    execution_mode: precomputed
    parameters:
      volume_delta_lag:
        type: int
        low: 1
        high: 180
        step: 1
        scale: linear
      close_delta_lag:
        type: int
        low: 1
        high: 180
        step: 1
        scale: linear
    # 边界扩展受此限制，始终保持在 1..180。
    parameter_limits:
      volume_delta_lag: {low: 1, high: 180}
      close_delta_lag: {low: 1, high: 180}

# 仅用于 `factors: all` 或 `parameters: auto`。
alpha101_parameter_generation:
  # 相对论文默认值 d 的搜索跨度 m；窗口约为 [d/m, d*m]，必须 > 1。
  range_multiplier: 10
  # 按公式签名顺序最多放开的可搜索维数，正整数；其余参数固定为论文默认值。
  max_dimensions: 5
  # 类型级硬边界：自动初始边界和后续自动扩边都不得突破这些范围。
  type_limits:
    window: {low: 1, high: 1260}
    lag: {low: 1, high: 504}
    weight: {low: 0.0, high: 1.0}
    threshold: {low: -100.0, high: 100.0}
    exponent: {low: 0.01, high: 100.0}

evaluation:
  # 评分区间 [开始日期, 结束日期]，格式 YYYY-MM-DD。
  span: ["2015-01-01", "2022-12-31"]
  # 调仓频率，使用 pandas 频率字符串；常用：D | W | M。
  rebal_freq: W
  # 可选：vector | exact。vector 适合大规模搜索，exact 适合精确成交复核。
  engine: vector
  # 回测初始资金，必须为正数。
  initial_amount: 100000000
  # 热力图只展示完整 span（total），并按每种滑动窗口组合分别输出。
  # 可选：行情查询容忍时间（小时），默认 24。
  # time_tolerance: 24

windows:
  # 评分窗口长度，单位为交易日，可配置多个正整数。
  lengths: [252, 756]
  # 窗口滑动步长，单位为交易日；每个 step 必须 <= 每个 length。
  steps: [21, 63]

search:
  coarse:
    # QMC 在完整边界内均匀覆盖采样。
    sampler: qmc
    qmc_type: sobol
    scramble: true
    n_trials: 128
    seed: 20260818
  refine:
    # 使用 TPE 根据已完成候选向优良区域收敛。
    enabled: true
    sampler: tpe
    n_trials: 48
    batch_size: 8
    n_startup_trials: 8
    bootstrap_top_k: 16
    seed: 20260819
  expansion:
    # 优胜候选集中触边时自动扩展边界，但受 parameter_limits 限制。
    enabled: true
    sampler: qmc
    qmc_type: sobol
    n_trials: 64
    max_rounds: 2
    boundary_top_k: 3
    boundary_tolerance: 0.10
    winner_ratio: 0.67
    range_multiplier: 3
    seed: 20260820
  fine:
    # 围绕宽搜/TPE 优胜候选生成局部网格，不遍历全域整数点。
    top_k: 10
    points_per_dimension: 7
    max_candidates: 343
  stability:
    # 对最终赢家做局部扰动稳定性审计。
    enabled: true
    top_k: 10
    perturbations_per_candidate: 8
    radius_ratio: 0.10
    max_objective_degradation: 0.20
    required_pass_ratio: 0.70
    minimum_valid_ratio: 0.80
    # 剪除未通过赢家邻域稳定性检验的候选。
    require_pass: true
    seed: 20260821

selection:
  objective:
    # 可选窗口指标：ann_ret | ann_vol | sharpe | mdd | calmar | turnover |
    # rank_ic | ic_coverage | n_days。
    metric: sharpe
    # 可选聚合：mean | median | p25 | min | max。
    aggregate: mean
    # 可选：maximize | minimize。
    direction: maximize
  # 每轮汇总后剪除覆盖不足或回撤过大的候选，再把优胜者送入后续阶段。
  filters:
    - metric: valid_window_ratio
      op: ">="
      value: 0.8
    - metric: max_mdd
      op: "<="
      value: 0.35
  top_k: 10
