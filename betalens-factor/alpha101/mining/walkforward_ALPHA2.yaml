mining:
  factors: [2]

  output_dir: outputs/_walkforward
  cache_dir: null
  runtime_root: null

  rolling_span: ['2010-01-01', '2022-12-31']
  valid: ['2023-01-01', '2025-12-31']

  n_quantiles: [40]
  rebal_freq: W
  initial_amount: 100000000

  sampler: grid
  max_grid_candidates: 1000
  n_trials: 96
  random_seed: 20260810

  rolling_mode: paired
  paired_schemes:
    train_lengths: [504, 756]
    test_lengths: [126, 189]
    steps: [63, 84]

  objective: robust_rank_ic
  objective_higher_is_better: true
  constraints:
    ic_coverage_min: 0.80
    max_drawdown_max: 0.35
    turnover_max: 1.00

  pruning:
    enabled: true
    stages: [0.25, 0.50, 1.00]
    reduction_factor: 4
    min_full_candidates: 8
    keep_paper_candidate: true

  report_top_n: 3
  engine: vector
  workers: 12
  min_workers: 10
  max_workers: 12
  max_active_windows: 12
  max_inflight_batches: 12
  grid_batch_max_candidates: 8
  grid_batch_target_seconds: 10
  grid_prefetch_batches: 24
  storage_queue_max_batches: 24
  audit_queue_max_events: 20000
  console_trial_events: false
  scheduler_schema_version: 3
  max_persist_overlap_batches: 1
  sqlite_batch_transactions: true
  scheduler_wait_seconds: 0.25
  audit_incremental: true
  blas_threads: 1
  log_level: INFO

  storage_url: null
  rebuild_cache: false
  resume: true
  fail_fast: true

  max_memory_ratio: 0.5
  max_warmup_days: 5000
  resource_check_seconds: 15
  resource_wait_minutes: 30
  memory_low_watermark_ratio: 0.15
  memory_resume_watermark_ratio: 0.20

  audit_mirror_seconds: 60
  partial_refresh_seconds: 60
  partial_refresh_trials: 250
  snapshot_seconds: 300

  max_windows_per_scheme: null
