mining:
  # all 表示依次挖掘 ALPHA1~ALPHA101；也可写成 [1, 58, 65]。
  factors: [1]

  # 路径相对于本 YAML 所在目录；101 个 Alpha 共用同一份缓存。
  output_dir: outputs/_walkforward
  cache_dir: outputs/_walkforward/_cache

  # 2010~2022 只用于动态 TRAIN -> TEST；2023~2025 是最终独立留出集，
  # 不参与候选重新选择。
  rolling_span: ['2010-01-01', '2022-12-31']
  valid: ['2023-01-01', '2025-12-31']

  # 周频调仓、10 分组；截面最高组做多、最低组做空。
  n_quantiles: [10]
  rebal_freq: W
  initial_amount: 100000000

  # GridSampler 穷举各 Alpha YAML 中明列的 mining.search_space；超过上限即失败。
  # 可切换为 motpe，此时 n_trials 是每个 TRAIN study 的预算，首个 trial 固定为论文参数。
  sampler: grid
  max_grid_candidates: 256
  n_trials: 96
  random_seed: 20260810
  trial_batch_size: null

  # paired 为真实 walk-forward：每个 TRAIN 后立即衔接一个 TEST，二者不重叠。
  # 下列三个数组做笛卡尔积，单位均为交易日；step 控制整对窗口前移距离。
  rolling_mode: paired
  paired_schemes:
    train_lengths: [252, 504]
    test_lengths: [63, 126]
    steps: [21, 42]

  # 同时最大化稳健 Rank IC 与训练窗 Sharpe。
  objective: robust_rank_ic
  objective_higher_is_better: true
  constraints:
    ic_coverage_min: 0.80
    max_drawdown_max: 0.35
    turnover_max: 1.00

  # 每个 TRAIN 窗独立锁定唯一参数，只用于紧随其后的 TEST。
  # 最后一个完整 TRAIN 窗的前 3 个锁参候选进入整段 VALID，由 exact 引擎生成报告。
  report_top_n: 3

  # 滚动粗筛使用 vector；VALID 前三名仍会调用标准 FactorPipeline exact 回测。
  engine: vector
  workers: 12
  log_level: INFO

  # null 表示在当前 Alpha 输出目录使用 study.sqlite3。也可显式设置
  # sqlite:///本地scratch/study.sqlite3 或 PostgreSQL URL；框架不会自动迁移。
  storage_url: null

  # false 时优先复用缓存，但 schema、日期、指数或输入指纹不匹配会自动重建。
  rebuild_cache: false

  # resume 按因子配置哈希跳过已完成项；单因子失败时继续后续 Alpha。
  resume: true
  fail_fast: false

  # worker 数会按 50% 物理内存上限自动收缩。max_warmup_days 是共享缓存
  # 最早向前扩展的日历天数，用于覆盖放大后的长周期候选。
  max_memory_ratio: 0.5
  max_warmup_days: 5000

  # null 表示运行每种 paired scheme 的全部可用窗口；整数可用于调试限量。
  max_windows_per_scheme: null
