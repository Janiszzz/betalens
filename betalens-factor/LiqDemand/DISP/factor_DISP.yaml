meta:
  class: LiqDemand
  name: DISP
  source: Nathan & Suominen (2026), The Liquidity-Demand Component of the Factor Zoo, SSRN 6909918
  formula: delta = -z_m( P / max_{s in past 252d} P )
  logic: 距52周高点的距离；取负后离高点越远（越可处置）因子值越高。论文发现这类股票在月末筹现金窗口被优先抛售而跑输，方向 negative。
factor_spec:
  inputs:
    close_wide: 收盘价(元)
  compute_kwargs:
    window: 252
  direction: negative
  table_name: daily_market
  index_code: 000906.SH
  use_industry: false
  use_mktcap: false
  industry_scheme: 申万一级行业
  backtest_metric: 收盘价(元)
weight:
  mode: freeplay
  long_groups: null
  short_groups: null
  group_weights: {}
  intra_group_allocation: {}
run:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  rebal_freq: D
  n_quantiles: 20
  initial_amount: 100000000
  benchmark_code: 000906.SH
  warmup_days: 400
  pretom_only: false
  pretom_lo: 9
  pretom_hi: 4
  include_profiling: true
  dump_excel: true
  output_dir: outputs/runs/manual
