mining:
  factor_module: factor_SAMPLE
  spec_factory: make_mining_spec
  gid_factory: mining_gid
  weight_hook: null
  valid_report_hook: mining_valid_report
  output_dir: outputs/walkforward
  cache_dir: outputs/walkforward/_cache
  grid:
    window: [120, 252]
    n_quantiles: [20]
  train: ['2010-01-01', '2019-12-31']
  test: ['2020-01-01', '2022-12-31']
  valid: ['2023-01-01', '2025-12-31']
  # Rolling window schemes are generated as window_lengths x steps.
  # Explicit pairs like [[252, 63]] are also accepted when needed.
  train_schemes:
    window_lengths: [252, 378]
    steps: [63, 126]
  test_schemes:
    window_lengths: [252, 378]
    steps: [21, 63]
  objective: sharpe
  objective_higher_is_better: true
  candidate_percentile: [0.5, 0.75]
  report_top_n: 3
  engine: vector
  workers: 4
  rebuild_cache: false
  max_memory_ratio: 0.5
  max_warmup_days: 1200
  max_windows_per_scheme: null
