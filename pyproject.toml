[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "betalens"
version = "1.1.0"
description = "因子分析与回测框架"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.3",
    "psycopg2-binary>=2.9.0",
    "matplotlib>=3.4.0",
    "statsmodels>=0.14.0",
    "akshare>=1.17.0",
    "sympy>=1.10.0",
    "prettytable>=3.0.0",
    "openpyxl>=3.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
viz = ["plotly>=5.0.0"]
dashboard = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pydantic>=2.7.0", "pyarrow>=14.0.0"]
db = ["psycopg2-binary>=2.9.0", "pyarrow>=14.0.0", "xlrd>=2.0.0"]
gui = ["PySide6>=6.7"]
mining = ["optuna>=4.9,<5"]
full = [
    "plotly>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pyarrow>=14.0.0",
    "xlrd>=2.0.0",
    "PySide6>=6.7",
    "optuna>=4.9,<5",
]

[tool.setuptools.packages.find]
include = ["betalens", "betalens.*", "betalens_db_manager", "betalens_db_manager.*"]
exclude = ["betalens-factor*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
betalens_db_manager = ["migrations/*.sql", "*.example.yaml", "assets/*.ico"]
