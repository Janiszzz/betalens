# Paths and glob patterns are resolved relative to this file and sorted stably.
version: 1

defaults:
  mode: insert_only
  on_rejected: fail
  options:
    chunk_rows: 100000

imports:
  # Every matched file is an independent transaction/checkpoint.
  - id: stock-daily-csv
    path: data/market/**/*.csv
    target: daily_market
    adapter: standard_long

  - id: fundamentals-ede
    path: data/fundamentals.xlsx
    target: fundamentals
    adapter: ede
    mode: upsert
    options:
      date_from: filename

  - id: csi800-constituents
    path: data/csi800_constituents.xlsx
    target: index_universe
    adapter: index_universe
    mode: upsert
    options:
      index_code: 000906.SH
      index_name: 中证800
      read_options:
        sheet_name: Sheet2
